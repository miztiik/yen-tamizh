name: deploy

# Build the static shell and publish it to GitHub Pages. Gated on CI: runs only
# AFTER the "ci" workflow concludes success on main, so a red build never
# deploys. workflow_dispatch is a manual escape hatch that bypasses the gate.
#
# Static-first (Holy Law #1): no runtime backend. base = /yen-tamizh/, and
# dist/404.html mirrors index.html so deep links boot the SPA. The real bank
# build (backend generate -> frontend/public/) lands in Row 13; for now deploy
# just publishes the shell. See docs/how-to/ship-to-github-pages.md and
# docs/architecture/runtime/stack-and-bundle.md.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only when CI passed (workflow_run path) or on a manual dispatch. If this is
    # skipped, the deploy job (needs: build) is skipped too and nothing publishes.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the exact commit CI validated (falls back to the dispatched ref).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES_BASE: /yen-tamizh/
      - name: verify SPA fallback (404.html == index.html)
        run: cmp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
