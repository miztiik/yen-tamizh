name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Frontend runtime: install, lint (eslint), svelte-check, unit tests (vitest),
  # production build, and the Playwright e2e smoke.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Pin npm to the version that produced the committed lockfile so `npm ci`
      # resolves the dependency graph (incl. the picomatch override) identically
      # to local. Matches the "packageManager" field in frontend/package.json.
      - run: npm install -g npm@10.9.2
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - name: install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: e2e smoke
        run: npm run test:e2e

  # Backend build-time producer: install the package + dev deps from pyproject,
  # type-check (mypy strict) and run the pytest smoke suite.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy
      - run: pytest -q

  # Schema drift gate (Row 5). The backend Pydantic models are the single source
  # of truth: regenerate schemas/*.schema.json (Python export) and the frontend
  # TS types + schema copies (npm run gen:contracts), then fail on any diff - so
  # the committed schema, types, and validators can never drift from the models.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # pyproject pins pydantic exactly so model_json_schema() output is
      # byte-reproducible here (Python 3.12) and locally (3.14).
      - name: install backend (Pydantic source of truth)
        run: pip install -e .
        working-directory: backend
      # Same pinned npm as the frontend job so the codegen deps
      # (json-schema-to-typescript) resolve identically to the committed lockfile.
      - name: install frontend codegen deps
        working-directory: frontend
        run: |
          npm install -g npm@10.9.2
          npm ci
      - name: regenerate schemas from the Pydantic models
        run: python -m yen_tamizh_backend.contracts.export
        working-directory: backend
      - name: regenerate frontend types + schema copies
        run: npm run gen:contracts
        working-directory: frontend
      - name: fail on any drift
        run: |
          git diff --exit-code -- schemas frontend/src/contracts
          if [ -n "$(git status --porcelain -- schemas frontend/src/contracts)" ]; then
            echo "::error::Regenerated contracts differ from the committed files. Run the exporter + 'npm run gen:contracts' and commit the result."
            git status --porcelain -- schemas frontend/src/contracts
            exit 1
          fi
